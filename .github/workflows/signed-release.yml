name: Signed APK release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-apk-release
  cancel-in-progress: false
jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify signing secrets
        env:
          KEYSTORE: ${{ secrets.NTH_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NTH_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NTH_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NTH_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "::error::Configure all four NTH_RELEASE signing secrets first."; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/nth-release.jks"
          chmod 600 "$RUNNER_TEMP/nth-release.jks"
      - name: Build and verify signed APK
        id: package
        env:
          NTH_SIGNING_STORE_FILE: ${{ runner.temp }}/nth-release.jks
          NTH_SIGNING_STORE_PASSWORD: ${{ secrets.NTH_RELEASE_STORE_PASSWORD }}
          NTH_SIGNING_KEY_ALIAS: ${{ secrets.NTH_RELEASE_KEY_ALIAS }}
          NTH_SIGNING_KEY_PASSWORD: ${{ secrets.NTH_RELEASE_KEY_PASSWORD }}
        run: python3 tools/build-signed-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: Nth-Desktop-3D-${{ steps.package.outputs.version }}-signed-release
          path: dist/
      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" dist/*.apk dist/*.sha256 dist/build-verification.json --target "$GITHUB_SHA" --title "Nth Desktop 3D ${RELEASE_VERSION}" --notes "Signed with the permanent 3D test-update certificate. Future builds using this same certificate and a higher versionCode update in place. Older debug builds require a one-time migration; read docs/SIGNED-APK-UPDATES.md before uninstalling."
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nth-release.jks"
