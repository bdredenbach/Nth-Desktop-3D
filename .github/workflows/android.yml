name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and unit tests
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDiscoverTest :app:assembleGoogle :app:lintGoogle :app:lintDiscoverTest :app:lintDebug :app:lintRelease :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Nth-Desktop-3D-${{ github.sha }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned release for private offline signing
        uses: actions/upload-artifact@v4
        with:
          name: Nth-Desktop-3D-${{ github.sha }}-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload unsigned Discover test for private offline signing
        uses: actions/upload-artifact@v4
        with:
          name: Nth-Desktop-3D-${{ github.sha }}-unsigned-discover-test
          path: app/build/outputs/apk/discoverTest/app-discoverTest-unsigned.apk
          if-no-files-found: error
      - name: Upload unsigned primary Google-enabled build
        uses: actions/upload-artifact@v4
        with:
          name: Nth-Desktop-3D-${{ github.sha }}-unsigned-google
          path: app/build/outputs/apk/google/app-google-unsigned.apk
          if-no-files-found: error
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, polish, core, settings, widgets]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ${{ matrix.suite }} regression on a fresh emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          avd-name: nth-desktop-3d
          force-avd-creation: true
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -wipe-data
          script: sh tools/android-smoke.sh ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-results-${{ matrix.suite }}
          path: |
            app/build/native-verification/
            app/build/replacement-check.log
