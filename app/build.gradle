plugins { id 'com.android.application' }

def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }

android {
    namespace 'com.nth.desktop3d'
    compileSdk 35
    buildFeatures { aidl true }
    sourceSets.main.assets.srcDirs += [rootProject.file('docs/licenses')]
    defaultConfig {
        applicationId 'com.nth.desktop3d'
        minSdk 26
        targetSdk 35
        versionCode appVersion.getProperty('versionCode').toInteger()
        versionName appVersion.getProperty('versionName')
        testInstrumentationRunner 'com.nth.desktop3d.test.SmokeInstrumentation'
        manifestPlaceholders = [launcherLabel:'@string/app_name']
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        stable {
            def path = System.getenv('NTH_SIGNING_STORE_FILE')
            def storePass = System.getenv('NTH_SIGNING_STORE_PASSWORD')
            def alias = System.getenv('NTH_SIGNING_KEY_ALIAS')
            def keyPass = System.getenv('NTH_SIGNING_KEY_PASSWORD')
            if (path && storePass && alias && keyPass) {
                storeFile file(path)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('NTH_SIGNING_STORE_FILE')) signingConfig signingConfigs.stable
        }
    }
    // Same package/version/key: a tester can replace the release and return without data loss.
    buildTypes {
        google {
            initWith release
            debuggable true
            signingConfig null
            manifestPlaceholders = [launcherLabel:'@string/app_name']
        }
        discoverTest {
            initWith release
            debuggable true
            signingConfig null
            versionNameSuffix '-discover-test'
            manifestPlaceholders = [launcherLabel:'@string/app_name_discover_test']
        }
    }
    // Used only by the emulator's in-place replacement check; production artifacts stay unsigned.
    if (project.hasProperty('nthCompatibilitySigning')) {
        buildTypes.release.signingConfig = signingConfigs.debug
        buildTypes.discoverTest.signingConfig = signingConfigs.debug
        buildTypes.google.signingConfig = signingConfigs.debug
    }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
