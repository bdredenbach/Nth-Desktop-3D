plugins { id 'com.android.application' }

def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }

android {
    namespace 'com.nth.desktop3d'
    compileSdk 35
    buildFeatures { aidl true }
    defaultConfig {
        applicationId 'com.nth.desktop3d'
        minSdk 26
        targetSdk 35
        versionCode appVersion.getProperty('versionCode').toInteger()
        versionName appVersion.getProperty('versionName')
        testInstrumentationRunner 'com.nth.desktop3d.test.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        stable {
            def path = System.getenv('NTH_SIGNING_STORE_FILE')
            def storePass = System.getenv('NTH_SIGNING_STORE_PASSWORD')
            def alias = System.getenv('NTH_SIGNING_KEY_ALIAS')
            def keyPass = System.getenv('NTH_SIGNING_KEY_PASSWORD')
            if (path && storePass && alias && keyPass) {
                storeFile file(path)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('NTH_SIGNING_STORE_FILE')) signingConfig signingConfigs.stable
        }
    }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
